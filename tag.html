<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050608">
  <title>G6k-Z3 · TAG</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:20px;background:#050608;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.card{width:min(460px,100%);padding:24px;border-radius:24px;background:linear-gradient(180deg,#171d26,#0b0f15);border:1px solid rgba(255,255,255,.1);box-shadow:0 24px 70px rgba(0,0,0,.55);text-align:center}.logo{width:68px;height:68px;border-radius:19px;margin:0 auto 18px;display:grid;place-items:center;background:#ff7a00;color:#111;font-weight:1000}h1{margin:0 0 8px;font-size:1.8rem}p{margin:0;color:#9fa7b2;line-height:1.5}.spin{width:34px;height:34px;border:3px solid rgba(255,255,255,.12);border-top-color:#ff7a00;border-radius:50%;margin:22px auto 0;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.error{color:#ff9ca2;margin-top:16px}
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
</head>
<body>
  <div class="card">
    <div class="logo">G6K</div>
    <h1>G6k-Z3</h1>
    <p id="status">Identificando acreditación…</p>
    <div id="spinner" class="spin"></div>
    <div id="error" class="error"></div>
  </div>
  <script>
    const cfg={apiKey:'AIzaSyD_vcPOimDMu4hLxe6mb0B0hZ85ZJwSYTA',authDomain:'g6k-z3.firebaseapp.com',databaseURL:'https://g6k-z3-default-rtdb.europe-west1.firebasedatabase.app/',projectId:'g6k-z3',storageBucket:'g6k-z3.firebasestorage.app',messagingSenderId:'1007699316093',appId:'1:1007699316093:web:1d00b1f102fd43acb91014'};
    firebase.initializeApp(cfg); const db=firebase.database();
    const token=new URLSearchParams(location.search).get('token')||'';
    const routes={'OFICIAL':'oficial.html','PRENSA':'prensa.html','PARTICIPANTE':'participante.html','ASISTENCIA':'asistencia.html','ORGANIZACIÓN':'organizacion.html','VIP':'vip.html'};
    (async()=>{
      if(!token){document.getElementById('spinner').style.display='none';document.getElementById('error').textContent='La TAG no contiene un token válido.';return;}
      try{
        const s=await db.ref('publicTags/'+token).once('value'); const d=s.val();
        if(!d||!routes[d.role]){document.getElementById('spinner').style.display='none';document.getElementById('status').textContent='TAG no válida o desactivada.';return;}
        document.getElementById('status').textContent='Acceso '+d.role+' autorizado.';
        const u=new URL(routes[d.role],location.href);u.searchParams.set('token',token);location.replace(u.href);
      }catch(e){console.error(e);document.getElementById('spinner').style.display='none';document.getElementById('error').textContent='No se pudo consultar Firebase.';}
    })();
  </script>
</body>
</html>
